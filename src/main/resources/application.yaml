logging:
  level:
    org:
      springframework:
        '': INFO
        security: INFO
        web: ${SPRING_WEB_DEBUG:INFO}
        beans:
          factory: INFO
      quark:
        misc:
          choresweb:
            sync: ${CHORES_SYNC_DEBUG:INFO}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: ChoresWeb
  datasource:
    url: jdbc:${DB_FLAVOR}://${DB_SERVER}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 60000
      leak-detection-threshold: 65000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        cache:
          use_second_level_cache: false
          use_query_cache: false
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
  devtools:
    restart:
      enabled: false

quark:
  sync:
    scaling:
      enabled: ${CHORES_SYNC_SCALING_ENABLED:false}
      max-events: ${CHORES_SYNC_SCALING_MAX_EVENTS:1000}
      stream-key: "choresDataStream"

chores:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    issuer: ${ISSUER_URI}
    accessTokenExpiry: ${ACCESS_TOKEN_EXPIRY}
    refreshTokenExpiry: ${REFRESH_TOKEN_EXPIRY}
    clientId: 823804539715-mb7lamcmkpoihnt297fevkrf1h3sgi1f.apps.googleusercontent.com
    secret: ${CHORES_JWT_SECRET}
  godList: ${CHORES_GOD_LIST)
  sync:
    cacheTimeout: 20s
